  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (() => {
      try {
        const t = localStorage.getItem('documents:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (localStorage.getItem('documents:dark-page') === '1') document.documentElement.dataset.page = 'dark';
      } catch {}
    })();
  </script>
